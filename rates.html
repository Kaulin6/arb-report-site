<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funding Rate History — Arb Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1e1e1e;
      --yellow: #ffe135;
      --green: #00ff87;
      --red: #ff3b3b;
      --white: #f5f2eb;
      --muted: #666;
      --blue: #60a5fa;
      --orange: #fb923c;
    }

    html, body {
      background: var(--bg);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 28px 40px 20px;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      letter-spacing: 0.04em;
      color: var(--yellow);
    }

    header span {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    /* ── Nav back ── */
    .nav-back {
      padding: 14px 40px 0;
    }

    .nav-back a {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.06em;
    }

    .nav-back a:hover { color: var(--yellow); }

    /* ── Main container ── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 40px 60px;
    }

    /* ── Pair selector tabs ── */
    .pair-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .pair-tab {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.1em;
      padding: 8px 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .pair-tab:hover {
      border-color: var(--yellow);
      color: var(--yellow);
    }

    .pair-tab.active {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--bg);
    }

    /* ── Chart panel ── */
    .chart-panel {
      display: none;
    }

    .chart-panel.visible {
      display: block;
    }

    /* ── Chart header ── */
    .chart-header {
      margin-bottom: 18px;
    }

    .chart-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.05em;
      color: var(--white);
      line-height: 1;
    }

    .chart-title .arrow {
      color: var(--yellow);
    }

    .chart-subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-top: 6px;
    }

    /* ── Chart wrapper ── */
    .chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      position: relative;
    }

    .chart-canvas-container {
      height: 600px;
      position: relative;
    }

    /* ── Stats pills ── */
    .stats-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .stat-pill {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      padding: 7px 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill .label {
      color: var(--muted);
      text-transform: uppercase;
    }

    .stat-pill .value {
      color: var(--white);
      font-weight: 500;
    }

    .stat-pill.healthy .value { color: var(--green); }
    .stat-pill.compressed .value { color: var(--yellow); }
    .stat-pill.inverted .value { color: var(--red); }

    /* ── Legend ── */
    .legend-row {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .legend-dot {
      width: 10px;
      height: 3px;
      border-radius: 1px;
    }

    /* ── Annotation ── */
    .annotation {
      margin-top: 20px;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: #444;
      letter-spacing: 0.05em;
      line-height: 1.6;
      border-left: 2px solid var(--border);
      padding-left: 12px;
    }

    /* ── Divider ── */
    .section-divider {
      height: 1px;
      background: var(--border);
      margin: 40px 0;
    }

    /* ── Scanline overlay ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>

// ── Helpers ───────────────────────────────────────────────────────────────────

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDate(ts) {
  const d = new Date(ts);
  return `${MONTHS[d.getMonth()]} ${d.getDate()}`;
}

function fmtHour(ts) {
  const d = new Date(ts);
  return `${MONTHS[d.getMonth()]} ${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:00`;
}

function getStatus(currentSpread, entrySpread) {
  const ratio = currentSpread / entrySpread;
  if (currentSpread < 0) return 'INVERTED';
  if (ratio < 0.5) return 'COMPRESSED';
  return 'HEALTHY';
}

// ── Build fill datasets ───────────────────────────────────────────────────────
// Chart.js fill between datasets: we split into two overlapping area fills.
// Green fill = max(longRate, shortRate) and min at shortRate when spread positive
// We use two fill layers: one green (shortRate - longRate when positive), one red (inverted).
// Simpler approach: Use a single background fill plugin with custom drawing.

// We'll use the built-in Chart.js fill between datasets approach:
// Dataset 0: long rate (no fill)
// Dataset 1: short rate (fill: 0) — but this fills to dataset 0 always one color
// So instead: we build two helper datasets that represent the upper/lower bound of the spread
// and color them per-segment using a custom plugin.

function buildChartConfig(pair, data) {
  const labels = data.points.map(p => fmtHour(p.ts));
  const longVals = data.points.map(p => +(p.longRate * 100).toFixed(6));
  const shortVals = data.points.map(p => +(p.shortRate * 100).toFixed(6));

  // Determine fill color per segment: if spread (shortRate - longRate) >= 0 → green, else red
  // We'll draw by building an upper/lower fill using a custom gradient segment approach.
  // For simplicity with Chart.js we use a custom plugin that draws colored fills per-segment.

  const GREEN_FILL = 'rgba(0, 255, 135, 0.15)';
  const RED_FILL   = 'rgba(255, 59, 59, 0.15)';
  const GREEN_LINE = 'rgba(0, 255, 135, 0.5)';
  const RED_LINE   = 'rgba(255, 59, 59, 0.5)';

  // Custom plugin: fill between long and short with per-segment color
  const fillBetweenPlugin = {
    id: `fillBetween_${pair}`,
    beforeDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea) return;
      const xScale = scales.x;
      const yScale = scales.y;
      const nPoints = longVals.length;
      if (nPoints < 2) return;

      ctx.save();
      ctx.rect(chartArea.left, chartArea.top, chartArea.width, chartArea.height);
      ctx.clip();

      for (let i = 0; i < nPoints - 1; i++) {
        const x0 = xScale.getPixelForValue(i);
        const x1 = xScale.getPixelForValue(i + 1);

        const lY0 = yScale.getPixelForValue(longVals[i]);
        const lY1 = yScale.getPixelForValue(longVals[i + 1]);
        const sY0 = yScale.getPixelForValue(shortVals[i]);
        const sY1 = yScale.getPixelForValue(shortVals[i + 1]);

        const spread0 = shortVals[i] - longVals[i];
        const spread1 = shortVals[i + 1] - longVals[i + 1];

        if (spread0 >= 0 && spread1 >= 0) {
          // All green
          ctx.beginPath();
          ctx.moveTo(x0, lY0);
          ctx.lineTo(x1, lY1);
          ctx.lineTo(x1, sY1);
          ctx.lineTo(x0, sY0);
          ctx.closePath();
          ctx.fillStyle = GREEN_FILL;
          ctx.fill();
        } else if (spread0 < 0 && spread1 < 0) {
          // All red
          ctx.beginPath();
          ctx.moveTo(x0, sY0);
          ctx.lineTo(x1, sY1);
          ctx.lineTo(x1, lY1);
          ctx.lineTo(x0, lY0);
          ctx.closePath();
          ctx.fillStyle = RED_FILL;
          ctx.fill();
        } else {
          // Mixed — find crossing point via linear interpolation
          const t = spread0 / (spread0 - spread1);
          const xCross = x0 + t * (x1 - x0);
          const lYCross = lY0 + t * (lY1 - lY0);
          const sYCross = sY0 + t * (sY1 - sY0);
          const yCross = (lYCross + sYCross) / 2;

          if (spread0 >= 0) {
            // Green first half
            ctx.beginPath();
            ctx.moveTo(x0, lY0);
            ctx.lineTo(xCross, yCross);
            ctx.lineTo(xCross, yCross);
            ctx.lineTo(x0, sY0);
            ctx.closePath();
            ctx.fillStyle = GREEN_FILL;
            ctx.fill();
            // Red second half
            ctx.beginPath();
            ctx.moveTo(xCross, yCross);
            ctx.lineTo(x1, lY1);
            ctx.lineTo(x1, sY1);
            ctx.lineTo(xCross, yCross);
            ctx.closePath();
            ctx.fillStyle = RED_FILL;
            ctx.fill();
          } else {
            // Red first half
            ctx.beginPath();
            ctx.moveTo(x0, sY0);
            ctx.lineTo(xCross, yCross);
            ctx.lineTo(xCross, yCross);
            ctx.lineTo(x0, lY0);
            ctx.closePath();
            ctx.fillStyle = RED_FILL;
            ctx.fill();
            // Green second half
            ctx.beginPath();
            ctx.moveTo(xCross, yCross);
            ctx.lineTo(x1, sY1);
            ctx.lineTo(x1, lY1);
            ctx.lineTo(xCross, yCross);
            ctx.closePath();
            ctx.fillStyle = GREEN_FILL;
            ctx.fill();
          }
        }
      }
      ctx.restore();
    }
  };

  // Tick label dedup: show date only when it changes
  const tickLabels = data.points.map((p, i) => {
    const d = new Date(p.ts);
    const label = `${MONTHS[d.getMonth()]} ${d.getDate()}`;
    if (i === 0) return label;
    const prev = new Date(data.points[i-1].ts);
    const prevLabel = `${MONTHS[prev.getMonth()]} ${prev.getDate()}`;
    return label !== prevLabel ? label : '';
  });

  const config = {
    type: 'line',
    plugins: [fillBetweenPlugin],
    data: {
      labels: tickLabels,
      datasets: [
        {
          label: data.long.toUpperCase(),
          data: longVals,
          borderColor: '#60a5fa',
          borderWidth: 2,
          pointRadius: 3,
          pointBackgroundColor: '#60a5fa',
          pointHoverRadius: 5,
          tension: 0.3,
          fill: false,
        },
        {
          label: data.short.toUpperCase(),
          data: shortVals,
          borderColor: '#fb923c',
          borderWidth: 2,
          pointRadius: 3,
          pointBackgroundColor: '#fb923c',
          pointHoverRadius: 5,
          tension: 0.3,
          fill: false,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false,
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#111',
          borderColor: '#1e1e1e',
          borderWidth: 1,
          titleColor: '#f5f2eb',
          bodyColor: '#999',
          titleFont: { family: 'DM Mono', size: 11 },
          bodyFont: { family: 'DM Mono', size: 11 },
          padding: 12,
          callbacks: {
            title(items) {
              const idx = items[0].dataIndex;
              return fmtHour(data.points[idx].ts);
            },
            label(item) {
              const sign = item.parsed.y >= 0 ? '+' : '';
              return `  ${item.dataset.label}: ${sign}${item.parsed.y.toFixed(4)}%`;
            },
            afterBody(items) {
              if (items.length >= 2) {
                const spread = items[1].parsed.y - items[0].parsed.y;
                const sign = spread >= 0 ? '+' : '';
                return [`  ─────────────`, `  SPREAD: ${sign}${spread.toFixed(4)}%`];
              }
              return [];
            }
          }
        }
      },
      scales: {
        x: {
          grid: {
            color: 'rgba(255,255,255,0.04)',
            drawTicks: false,
          },
          ticks: {
            color: '#555',
            font: { family: 'DM Mono', size: 10 },
            maxRotation: 0,
            autoSkip: false,
            callback(val, idx) {
              return tickLabels[idx];
            }
          },
          border: { color: '#1e1e1e' }
        },
        y: {
          grid: {
            color: 'rgba(255,255,255,0.04)',
            drawTicks: false,
          },
          ticks: {
            color: '#555',
            font: { family: 'DM Mono', size: 10 },
            callback(val) {
              return (val >= 0 ? '+' : '') + val.toFixed(3) + '%';
            }
          },
          border: { color: '#1e1e1e', dash: [2, 4] },
          // Zero line via annotation-like approach using afterDraw
        }
      }
    }
  };

  return { config, fillBetweenPlugin };
}

// ── Render panels ─────────────────────────────────────────────────────────────

const panelsContainer = document.getElementById('chartPanels');
const charts = {};

Object.entries(pairData).forEach(([coin, data]) => {
  const status = getStatus(data.currentSpread, data.entrySpread);
  const statusClass = status.toLowerCase();

  const panel = document.createElement('div');
  panel.className = 'chart-panel';
  panel.id = `panel-${coin}`;

  panel.innerHTML = `
    <div class="chart-header">
      <div class="chart-title">
        ${coin} <span class="arrow">—</span> ${data.long.toUpperCase()} <span class="arrow">→</span> ${data.short.toUpperCase()}
      </div>
      <div class="chart-subtitle">GAP = FUNDING RATE YOU COLLECT PER 8H · ${data.points.length} DATA POINTS</div>
    </div>

    <div class="chart-wrap">
      <div class="chart-canvas-container">
        <canvas id="chart-${coin}"></canvas>
      </div>

      <div class="legend-row">
        <div class="legend-item">
          <div class="legend-dot" style="background:#60a5fa"></div>
          LONG · ${data.long.toUpperCase()}
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#fb923c"></div>
          SHORT · ${data.short.toUpperCase()}
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:rgba(0,255,135,0.5); width:16px"></div>
          POSITIVE SPREAD
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:rgba(255,59,59,0.5); width:16px"></div>
          INVERTED
        </div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-pill">
        <span class="label">Entry Spread</span>
        <span class="value">${data.entrySpread.toFixed(3)}%</span>
      </div>
      <div class="stat-pill">
        <span class="label">Current Spread</span>
        <span class="value">${data.currentSpread.toFixed(3)}%</span>
      </div>
      <div class="stat-pill ${statusClass}">
        <span class="label">Status</span>
        <span class="value">${status}</span>
      </div>
    </div>

    <div class="annotation">
      Green shaded area = funding rate differential you collect each 8h.
      When lines cross = spread inverted temporarily.
      Spread = short rate − long rate. Positive = arb earns. Negative = arb pays.
    </div>
  `;

  panelsContainer.appendChild(panel);

  // Build chart
  const { config, fillBetweenPlugin } = buildChartConfig(coin, data);
  const canvas = document.getElementById(`chart-${coin}`);
  const ctx = canvas.getContext('2d');

  // Zero-line plugin
  const zeroLinePlugin = {
    id: `zeroLine_${coin}`,
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!scales.y) return;
      const y0 = scales.y.getPixelForValue(0);
      if (y0 < chartArea.top || y0 > chartArea.bottom) return;
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(chartArea.left, y0);
      ctx.lineTo(chartArea.right, y0);
      ctx.stroke();
      ctx.restore();
    }
  };

  const chart = new Chart(ctx, {
    ...config,
    plugins: [fillBetweenPlugin, zeroLinePlugin, ...(config.plugins || [])]
  });
  charts[coin] = chart;
});

// ── Tab switching ─────────────────────────────────────────────────────────────

function showPair(coin) {
  // Update tabs
  document.querySelectorAll('.pair-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.pair === coin);
  });
  // Update panels
  document.querySelectorAll('.chart-panel').forEach(panel => {
    panel.classList.toggle('visible', panel.id === `panel-${coin}`);
  });
}

document.getElementById('pairTabs').addEventListener('click', e => {
  if (e.target.classList.contains('pair-tab')) {
    showPair(e.target.dataset.pair);
  }
});

// Show first pair on load
showPair('BLAST');
</script>
