<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funding Rate History — Arb Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1e1e1e;
      --yellow: #ffe135;
      --green: #00ff87;
      --red: #ff3b3b;
      --white: #f5f2eb;
      --muted: #666;
      --blue: #60a5fa;
      --orange: #fb923c;
    }

    html, body {
      background: var(--bg);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 28px 40px 20px;
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      letter-spacing: 0.04em;
      color: var(--yellow);
    }

    header .header-meta {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    #lastUpdated {
      color: var(--green);
      transition: color 0.3s;
    }

    #lastUpdated.stale { color: var(--yellow); }

    .live-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Nav bar ── */
    .topnav {
      background: #0d0d0d;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 0;
      height: 44px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topnav-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      color: var(--yellow);
      letter-spacing: 2px;
      margin-right: 28px;
    }
    .topnav a {
      color: #666;
      text-decoration: none;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      padding: 0 14px;
      height: 44px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .topnav a:hover { color: var(--white); }
    .topnav a.active {
      color: var(--yellow);
      border-bottom-color: var(--yellow);
    }

    /* ── Nav back (kept for compat) ── */
    .nav-back {
      display: none;
    }

    .nav-back a {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.06em;
    }

    .nav-back a:hover { color: var(--yellow); }

    /* ── Main container ── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 40px 60px;
    }

    /* ── Loading state ── */
    .loading-state {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      padding: 60px 0;
      text-align: center;
    }

    .loading-state .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--yellow);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-state {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--red);
      letter-spacing: 0.06em;
      padding: 40px 0;
      text-align: center;
      border: 1px solid rgba(255,59,59,0.2);
      background: rgba(255,59,59,0.04);
    }

    /* ── Pair selector tabs ── */
    .pair-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .pair-tab {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.1em;
      padding: 8px 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      position: relative;
    }

    .pair-tab:hover {
      border-color: var(--yellow);
      color: var(--yellow);
    }

    .pair-tab.active {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--bg);
    }

    .pair-tab .apr-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      display: block;
      margin-top: 1px;
      opacity: 0.7;
    }

    /* ── Chart panel ── */
    .chart-panel {
      display: none;
    }

    .chart-panel.visible {
      display: block;
    }

    /* ── Chart header ── */
    .chart-header {
      margin-bottom: 18px;
    }

    .chart-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.05em;
      color: var(--white);
      line-height: 1;
    }

    .chart-title .arrow {
      color: var(--yellow);
    }

    .chart-subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-top: 6px;
    }

    /* ── Chart wrapper ── */
    .chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      position: relative;
    }

    .chart-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 300px;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .chart-canvas-container {
      height: 600px;
      position: relative;
    }

    /* ── Stats pills ── */
    .stats-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .stat-pill {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      padding: 7px 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill .label {
      color: var(--muted);
      text-transform: uppercase;
    }

    .stat-pill .value {
      color: var(--white);
      font-weight: 500;
    }

    .stat-pill.healthy .value { color: var(--green); }
    .stat-pill.compressed .value { color: var(--yellow); }
    .stat-pill.inverted .value { color: var(--red); }

    /* ── Legend ── */
    .legend-row {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .legend-dot {
      width: 10px;
      height: 3px;
      border-radius: 1px;
    }

    /* ── Annotation ── */
    .annotation {
      margin-top: 20px;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: #444;
      letter-spacing: 0.05em;
      line-height: 1.6;
      border-left: 2px solid var(--border);
      padding-left: 12px;
    }

    /* ── Scanline overlay ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────────────────────────────────────

const API_BASE = (() => {
  const h = window.location.hostname;
  if (h.includes('onrender.com') || h.includes('github.io')) {
    return 'https://mvp-polymarket-alpha-bot.onrender.com';
  }
  return 'http://localhost:3124';
})();

const EXCLUDED_COINS = new Set([
  'SPYX','AAPLX','GOOGLX','MSFTX','TSLAX','AMZNX','NVDAX','METAX',
  'MSTRX','QQQX','PAXG','XAUT','CRCLX'
]);

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────

let lastFetchTime = null;
let updateTimerInterval = null;
let activeCharts = {};
let activePairs = [];
let currentCoin = null;

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────

function fmtHour(ts) {
  const d = new Date(ts);
  return `${MONTHS[d.getMonth()]} ${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:00`;
}

function bucket2h(ts) {
  return Math.floor(ts / (2 * 3600 * 1000)) * (2 * 3600 * 1000);
}

function joinHistories(longHistory, shortHistory) {
  // Build map: bucket → {longRate, ts}
  const longMap = new Map();
  for (const row of longHistory) {
    const ts = typeof row.timestamp === 'number' ? row.timestamp
              : typeof row.ts === 'number' ? row.ts
              : new Date(row.timestamp || row.ts || row.time).getTime();
    const b = bucket2h(ts);
    longMap.set(b, { ts, rate: row.rate ?? row.fundingRate ?? row.funding_rate ?? 0 });
  }

  const shortMap = new Map();
  for (const row of shortHistory) {
    const ts = typeof row.timestamp === 'number' ? row.timestamp
              : typeof row.ts === 'number' ? row.ts
              : new Date(row.timestamp || row.ts || row.time).getTime();
    const b = bucket2h(ts);
    shortMap.set(b, { ts, rate: row.rate ?? row.fundingRate ?? row.funding_rate ?? 0 });
  }

  // Find overlapping buckets
  const joined = [];
  for (const [b, lv] of longMap.entries()) {
    if (shortMap.has(b)) {
      const sv = shortMap.get(b);
      joined.push({
        ts: lv.ts,
        longRate: lv.rate,
        shortRate: sv.rate,
      });
    }
  }

  joined.sort((a, b) => a.ts - b.ts);
  return joined;
}

function getSpreadStatus(grossSpread) {
  if (grossSpread < 0) return 'INVERTED';
  if (grossSpread < 0.1) return 'COMPRESSED';
  return 'HEALTHY';
}

function secsAgo(ts) {
  return Math.round((Date.now() - ts) / 1000);
}

// ─────────────────────────────────────────────────────────────────────────────
// CHART BUILDER (same fill-between logic as original)
// ─────────────────────────────────────────────────────────────────────────────

function buildChart(canvasId, pair, points) {
  const labels = points.map((p, i) => {
    const d = new Date(p.ts);
    const label = `${MONTHS[d.getMonth()]} ${d.getDate()}`;
    if (i === 0) return label;
    const prev = new Date(points[i-1].ts);
    const prevLabel = `${MONTHS[prev.getMonth()]} ${prev.getDate()}`;
    return label !== prevLabel ? label : '';
  });

  const longVals  = points.map(p => +(p.longRate  * 100).toFixed(6));
  const shortVals = points.map(p => +(p.shortRate * 100).toFixed(6));

  const GREEN_FILL = 'rgba(0, 255, 135, 0.15)';
  const RED_FILL   = 'rgba(255, 59, 59, 0.15)';

  const fillBetweenPlugin = {
    id: `fillBetween_${canvasId}`,
    beforeDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea) return;
      const xScale = scales.x;
      const yScale = scales.y;
      const nPoints = longVals.length;
      if (nPoints < 2) return;

      ctx.save();
      ctx.rect(chartArea.left, chartArea.top, chartArea.width, chartArea.height);
      ctx.clip();

      for (let i = 0; i < nPoints - 1; i++) {
        const x0 = xScale.getPixelForValue(i);
        const x1 = xScale.getPixelForValue(i + 1);
        const lY0 = yScale.getPixelForValue(longVals[i]);
        const lY1 = yScale.getPixelForValue(longVals[i + 1]);
        const sY0 = yScale.getPixelForValue(shortVals[i]);
        const sY1 = yScale.getPixelForValue(shortVals[i + 1]);
        const spread0 = shortVals[i]   - longVals[i];
        const spread1 = shortVals[i+1] - longVals[i+1];

        if (spread0 >= 0 && spread1 >= 0) {
          ctx.beginPath();
          ctx.moveTo(x0, lY0); ctx.lineTo(x1, lY1);
          ctx.lineTo(x1, sY1); ctx.lineTo(x0, sY0);
          ctx.closePath(); ctx.fillStyle = GREEN_FILL; ctx.fill();
        } else if (spread0 < 0 && spread1 < 0) {
          ctx.beginPath();
          ctx.moveTo(x0, sY0); ctx.lineTo(x1, sY1);
          ctx.lineTo(x1, lY1); ctx.lineTo(x0, lY0);
          ctx.closePath(); ctx.fillStyle = RED_FILL; ctx.fill();
        } else {
          const t = spread0 / (spread0 - spread1);
          const xCross = x0 + t * (x1 - x0);
          const lYCross = lY0 + t * (lY1 - lY0);
          const sYCross = sY0 + t * (sY1 - sY0);
          const yCross  = (lYCross + sYCross) / 2;
          if (spread0 >= 0) {
            ctx.beginPath(); ctx.moveTo(x0, lY0); ctx.lineTo(xCross, yCross);
            ctx.lineTo(x0, sY0); ctx.closePath(); ctx.fillStyle = GREEN_FILL; ctx.fill();
            ctx.beginPath(); ctx.moveTo(xCross, yCross); ctx.lineTo(x1, lY1);
            ctx.lineTo(x1, sY1); ctx.closePath(); ctx.fillStyle = RED_FILL; ctx.fill();
          } else {
            ctx.beginPath(); ctx.moveTo(x0, sY0); ctx.lineTo(xCross, yCross);
            ctx.lineTo(x0, lY0); ctx.closePath(); ctx.fillStyle = RED_FILL; ctx.fill();
            ctx.beginPath(); ctx.moveTo(xCross, yCross); ctx.lineTo(x1, sY1);
            ctx.lineTo(x1, lY1); ctx.closePath(); ctx.fillStyle = GREEN_FILL; ctx.fill();
          }
        }
      }
      ctx.restore();
    }
  };

  const zeroLinePlugin = {
    id: `zeroLine_${canvasId}`,
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!scales.y) return;
      const y0 = scales.y.getPixelForValue(0);
      if (y0 < chartArea.top || y0 > chartArea.bottom) return;
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(chartArea.left, y0); ctx.lineTo(chartArea.right, y0);
      ctx.stroke(); ctx.restore();
    }
  };

  const canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  const ctx = canvas.getContext('2d');

  const chart = new Chart(ctx, {
    type: 'line',
    plugins: [fillBetweenPlugin, zeroLinePlugin],
    data: {
      labels,
      datasets: [
        {
          label: pair.longExchange.toUpperCase(),
          data: longVals,
          borderColor: '#60a5fa',
          borderWidth: 2,
          pointRadius: points.length > 50 ? 1 : 3,
          pointBackgroundColor: '#60a5fa',
          pointHoverRadius: 5,
          tension: 0.3,
          fill: false,
        },
        {
          label: pair.shortExchange.toUpperCase(),
          data: shortVals,
          borderColor: '#fb923c',
          borderWidth: 2,
          pointRadius: points.length > 50 ? 1 : 3,
          pointBackgroundColor: '#fb923c',
          pointHoverRadius: 5,
          tension: 0.3,
          fill: false,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#111',
          borderColor: '#1e1e1e',
          borderWidth: 1,
          titleColor: '#f5f2eb',
          bodyColor: '#999',
          titleFont: { family: 'DM Mono', size: 11 },
          bodyFont:  { family: 'DM Mono', size: 11 },
          padding: 12,
          callbacks: {
            title(items) {
              const idx = items[0].dataIndex;
              return fmtHour(points[idx].ts);
            },
            label(item) {
              const sign = item.parsed.y >= 0 ? '+' : '';
              return `  ${item.dataset.label}: ${sign}${item.parsed.y.toFixed(4)}%`;
            },
            afterBody(items) {
              if (items.length >= 2) {
                const spread = items[1].parsed.y - items[0].parsed.y;
                const sign = spread >= 0 ? '+' : '';
                return [`  ─────────────`, `  SPREAD: ${sign}${spread.toFixed(4)}%`];
              }
              return [];
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.04)', drawTicks: false },
          ticks: {
            color: '#555',
            font: { family: 'DM Mono', size: 10 },
            maxRotation: 0,
            autoSkip: false,
            callback(val, idx) { return labels[idx]; }
          },
          border: { color: '#1e1e1e' }
        },
        y: {
          grid: { color: 'rgba(255,255,255,0.04)', drawTicks: false },
          ticks: {
            color: '#555',
            font: { family: 'DM Mono', size: 10 },
            callback(val) { return (val >= 0 ? '+' : '') + val.toFixed(3) + '%'; }
          },
          border: { color: '#1e1e1e', dash: [2, 4] }
        }
      }
    }
  });

  return chart;
}

// ─────────────────────────────────────────────────────────────────────────────
// DOM BUILDERS
// ─────────────────────────────────────────────────────────────────────────────

function buildTabsHTML(pairs) {
  return `<div class="pair-tabs" id="pairTabs">
    ${pairs.map((p, i) => `
      <button class="pair-tab${i === 0 ? ' active' : ''}" data-idx="${i}">
        ${p.coin}
        <span class="apr-badge">${(p.grossSpread * 3 * 365).toFixed(0)}% APR</span>
      </button>
    `).join('')}
  </div>`;
}

function buildPanelHTML(pair, idx) {
  const status      = getSpreadStatus(pair.grossSpread);
  const statusClass = status.toLowerCase();
  const apr         = (pair.grossSpread * 3 * 365).toFixed(1);

  return `
    <div class="chart-panel${idx === 0 ? ' visible' : ''}" id="panel-${idx}">
      <div class="chart-header">
        <div class="chart-title">
          ${pair.coin} <span class="arrow">—</span>
          ${pair.longExchange.toUpperCase()} <span class="arrow">→</span>
          ${pair.shortExchange.toUpperCase()}
        </div>
        <div class="chart-subtitle">
          GAP = FUNDING RATE COLLECTED PER 8H · LIVE DATA · ${API_BASE.includes('localhost') ? 'LOCAL' : 'RENDER'}
        </div>
      </div>

      <div class="chart-wrap">
        <div id="chart-wrap-${idx}">
          <div class="chart-loading">
            <span class="spinner" style="display:inline-block;width:14px;height:14px;border:2px solid #1e1e1e;border-top-color:#ffe135;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle;"></span>
            LOADING HISTORY…
          </div>
        </div>

        <div class="legend-row">
          <div class="legend-item">
            <div class="legend-dot" style="background:#60a5fa"></div>
            LONG · ${pair.longExchange.toUpperCase()}
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:#fb923c"></div>
            SHORT · ${pair.shortExchange.toUpperCase()}
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:rgba(0,255,135,0.5);width:16px"></div>
            POSITIVE SPREAD
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:rgba(255,59,59,0.5);width:16px"></div>
            INVERTED
          </div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-pill">
          <span class="label">Gross Spread</span>
          <span class="value">${(pair.grossSpread * 100).toFixed(4)}%</span>
        </div>
        <div class="stat-pill">
          <span class="label">Net Spread</span>
          <span class="value">${(pair.netSpread * 100).toFixed(4)}%</span>
        </div>
        <div class="stat-pill">
          <span class="label">APR (Est)</span>
          <span class="value">${apr}%</span>
        </div>
        <div class="stat-pill">
          <span class="label">Long Rate</span>
          <span class="value">${(pair.longRate * 100).toFixed(4)}%</span>
        </div>
        <div class="stat-pill">
          <span class="label">Short Rate</span>
          <span class="value">${(pair.shortRate * 100).toFixed(4)}%</span>
        </div>
        <div class="stat-pill ${statusClass}">
          <span class="label">Status</span>
          <span class="value">${status}</span>
        </div>
      </div>

      <div class="annotation">
        Green shaded area = funding rate differential collected each 8h.
        When lines cross = spread inverted temporarily.
        Spread = short rate − long rate. Positive = arb earns. Negative = arb pays.
      </div>
    </div>
  `;
}

// ─────────────────────────────────────────────────────────────────────────────
// DATA FETCHING
// ─────────────────────────────────────────────────────────────────────────────

async function fetchOpportunities() {
  const res = await fetch(`${API_BASE}/api/opportunities`);
  if (!res.ok) throw new Error(`/api/opportunities returned ${res.status}`);
  return res.json();
}

async function fetchHistory(coin, exchange, limit = 100) {
  const url = `${API_BASE}/api/history?coin=${encodeURIComponent(coin)}&exchange=${encodeURIComponent(exchange)}&limit=${limit}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`/api/history returned ${res.status} for ${coin}/${exchange}`);
  return res.json();
}

async function loadChartForPair(pair, idx) {
  const wrapEl = document.getElementById(`chart-wrap-${idx}`);
  if (!wrapEl) return;

  try {
    const [longHist, shortHist] = await Promise.all([
      fetchHistory(pair.coin, pair.longExchange, 100),
      fetchHistory(pair.coin, pair.shortExchange, 100),
    ]);

    // Normalize: API may return array directly or { data: [...] }
    const longArr  = Array.isArray(longHist)  ? longHist  : (longHist.data  || longHist.history  || []);
    const shortArr = Array.isArray(shortHist) ? shortHist : (shortHist.data || shortHist.history || []);

    const points = joinHistories(longArr, shortArr);

    if (points.length < 2) {
      wrapEl.innerHTML = `<div class="chart-loading" style="color:#555">NO HISTORY DATA · ${points.length} POINTS JOINED</div>`;
      return;
    }

    wrapEl.innerHTML = `<div class="chart-canvas-container"><canvas id="canvas-${idx}"></canvas></div>`;

    const chart = buildChart(`canvas-${idx}`, pair, points);
    if (chart) activeCharts[idx] = chart;

    // Update subtitle with point count
    const subtitle = document.querySelector(`#panel-${idx} .chart-subtitle`);
    if (subtitle) {
      subtitle.textContent = `GAP = FUNDING RATE COLLECTED PER 8H · ${points.length} DATA POINTS · LIVE`;
    }
  } catch (err) {
    wrapEl.innerHTML = `<div class="chart-loading" style="color:var(--red)">ERROR LOADING HISTORY: ${err.message}</div>`;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN RENDER
// ─────────────────────────────────────────────────────────────────────────────

async function render() {
  const root = document.getElementById('appRoot');

  // Show loading
  root.innerHTML = `<div class="loading-state"><span class="spinner"></span>FETCHING LIVE OPPORTUNITIES…</div>`;

  let allOpps;
  try {
    allOpps = await fetchOpportunities();
  } catch (err) {
    root.innerHTML = `<div class="error-state">⚠ FAILED TO FETCH OPPORTUNITIES<br>${err.message}<br><br>API: ${API_BASE}</div>`;
    return;
  }

  // Normalize response shape
  const oppsArr = Array.isArray(allOpps) ? allOpps : (allOpps.opportunities || allOpps.data || []);

  // Filter: exclude drift exchange, exclude tokenized stocks
  const filtered = oppsArr.filter(o => {
    const longEx  = (o.longExchange  || '').toLowerCase();
    const shortEx = (o.shortExchange || '').toLowerCase();
    const coin    = (o.coin || '').toUpperCase();
    if (longEx === 'drift' || shortEx === 'drift') return false;
    if (EXCLUDED_COINS.has(coin)) return false;
    return true;
  });

  // Sort by grossSpread desc, take top 10
  filtered.sort((a, b) => (b.grossSpread || 0) - (a.grossSpread || 0));
  const top10 = filtered.slice(0, 10);

  if (top10.length === 0) {
    root.innerHTML = `<div class="error-state">NO OPPORTUNITIES RETURNED FROM API<br>API: ${API_BASE}</div>`;
    return;
  }

  activePairs = top10;
  lastFetchTime = Date.now();

  // Build HTML: tabs + panels
  const tabsHTML   = buildTabsHTML(top10);
  const panelsHTML = top10.map((p, i) => buildPanelHTML(p, i)).join('');

  root.innerHTML = `${tabsHTML}<div id="chartPanels">${panelsHTML}</div>`;

  // Tab click handler
  document.getElementById('pairTabs').addEventListener('click', e => {
    const btn = e.target.closest('.pair-tab');
    if (!btn) return;
    const idx = parseInt(btn.dataset.idx, 10);
    showPanel(idx);
  });

  updateLastUpdated();

  // Load chart for first pair immediately
  await loadChartForPair(top10[0], 0);

  // Load rest in background (don't await all)
  for (let i = 1; i < top10.length; i++) {
    loadChartForPair(top10[i], i);
  }
}

function showPanel(idx) {
  // Tabs
  document.querySelectorAll('.pair-tab').forEach((tab, i) => {
    tab.classList.toggle('active', i === idx);
  });
  // Panels
  document.querySelectorAll('.chart-panel').forEach((panel, i) => {
    panel.classList.toggle('visible', i === idx);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// LAST UPDATED INDICATOR
// ─────────────────────────────────────────────────────────────────────────────

function updateLastUpdated() {
  const el = document.getElementById('lastUpdated');
  if (!el) return;
  if (!lastFetchTime) { el.textContent = 'LOADING…'; return; }

  const secs = secsAgo(lastFetchTime);
  el.className = secs > 90 ? 'stale' : '';

  if (secs < 60) {
    el.innerHTML = `<span class="live-dot"></span>UPDATED ${secs}s AGO`;
  } else {
    const mins = Math.floor(secs / 60);
    el.innerHTML = `<span class="live-dot" style="background:${secs > 90 ? 'var(--yellow)' : 'var(--green)'}"></span>UPDATED ${mins}m AGO`;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// REFRESH LOOP (every 60s)
// ─────────────────────────────────────────────────────────────────────────────

function startRefreshLoop() {
  // Update the "X seconds ago" ticker every 5s
  setInterval(updateLastUpdated, 5000);

  // Re-fetch everything every 60s
  setInterval(async () => {
    // Destroy existing charts
    Object.values(activeCharts).forEach(c => c.destroy());
    activeCharts = {};
    await render();
  }, 60000);
}

// ─────────────────────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────────────────────

render().then(() => startRefreshLoop());
</script>
