<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Report — Funding Rate Arb</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --bg2: #111111;
      --bg3: #1a1a1a;
      --border: #2a2a2a;
      --border2: #333333;
      --text: #e8e8e8;
      --muted: #666;
      --yellow: #f5c518;
      --green: #00c896;
      --red: #ff4444;
      --orange: #ff8c00;
      --blue: #4a9eff;
      --purple: #9b59b6;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 0;
      height: 48px;
    }
    nav .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      color: var(--yellow);
      margin-right: 32px;
      letter-spacing: 2px;
    }
    nav a {
      text-decoration: none;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 0 16px;
      height: 48px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      letter-spacing: 0.5px;
    }
    nav a:hover { color: var(--text); }
    nav a.active {
      color: var(--yellow);
      border-bottom-color: var(--yellow);
    }

    /* CONTAINER */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* HEADER */
    .header {
      margin-bottom: 28px;
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      letter-spacing: 4px;
      color: var(--text);
      line-height: 1;
    }
    .header .subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.5px;
    }
    .header .updated {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #444;
      margin-top: 4px;
    }

    /* STATS BAR */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
    }
    .stat-card .label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 1px;
      line-height: 1;
    }
    .stat-card.pnl .value { color: var(--green); }
    .stat-card.pnl .value.negative { color: var(--red); }
    .stat-card.winrate .value { color: var(--blue); }
    .stat-card.healthy .value { color: var(--green); }
    .stat-card.inverted .value { color: var(--red); }

    /* HEALTH BAR */
    .health-bar-section {
      margin-bottom: 20px;
    }
    .health-bar-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .health-bar {
      height: 24px;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      background: var(--bg3);
      border: 1px solid var(--border);
    }
    .health-bar .seg {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      transition: width 0.4s ease;
      white-space: nowrap;
      overflow: hidden;
    }
    .health-bar .seg.healthy { background: rgba(0,200,150,0.3); color: var(--green); border-right: 1px solid rgba(0,200,150,0.5); }
    .health-bar .seg.compressed { background: rgba(245,197,24,0.2); color: var(--yellow); border-right: 1px solid rgba(245,197,24,0.4); }
    .health-bar .seg.inverted { background: rgba(255,68,68,0.25); color: var(--red); }
    .health-bar-legend {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }
    .legend-item {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 8px; height: 8px; border-radius: 2px;
    }
    .legend-dot.healthy { background: var(--green); }
    .legend-dot.compressed { background: var(--yellow); }
    .legend-dot.inverted { background: var(--red); }

    /* ALERT / INFO BOXES */
    .alert-box {
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .alert-box.inverted-alert {
      background: rgba(255,68,68,0.05);
      border: 1px solid rgba(255,68,68,0.4);
    }
    .alert-box.improving-alert {
      background: rgba(0,200,150,0.05);
      border: 1px solid rgba(0,200,150,0.35);
    }
    .alert-box.exit-info {
      background: rgba(245,197,24,0.04);
      border-left: 3px solid var(--yellow);
      border-top: 1px solid rgba(245,197,24,0.15);
      border-right: 1px solid rgba(245,197,24,0.15);
      border-bottom: 1px solid rgba(245,197,24,0.15);
    }
    .alert-box .box-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .inverted-alert .box-title { color: var(--yellow); }
    .improving-alert .box-title { color: var(--green); }
    .exit-info .box-title { color: var(--yellow); }
    .alert-box .box-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      font-family: 'DM Mono', monospace;
    }
    .alert-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .alert-item {
      background: rgba(255,255,255,0.03);
      border-radius: 4px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .alert-item .coin-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: 1px;
      color: var(--yellow);
      min-width: 60px;
    }
    .alert-item .route {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      flex: 1;
    }
    .alert-item .bleed {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--red);
      font-weight: 500;
    }
    .alert-item .grow {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--green);
      font-weight: 500;
    }
    .alert-item .pnl-val {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
    }
    .exit-info p {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text);
      opacity: 0.85;
    }

    /* TABLE */
    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .table-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--text);
    }
    .sort-hint {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
    }
    thead th {
      background: var(--bg3);
      padding: 12px 14px;
      text-align: left;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
      transition: color 0.15s;
      position: relative;
    }
    thead th:hover { color: var(--text); }
    thead th.sort-asc::after { content: ' ▲'; color: var(--yellow); font-size: 9px; }
    thead th.sort-desc::after { content: ' ▼'; color: var(--yellow); font-size: 9px; }
    thead th.sorted { color: var(--yellow); }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.025); }

    td {
      padding: 11px 14px;
      white-space: nowrap;
    }

    /* COIN BADGE */
    .coin-badge {
      background: rgba(245,197,24,0.12);
      border: 1px solid rgba(245,197,24,0.3);
      color: var(--yellow);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 3px;
      display: inline-block;
    }

    /* CURRENT % COLORS */
    .spread-green { color: var(--green); }
    .spread-yellow { color: var(--yellow); }
    .spread-red { color: var(--red); }

    /* TREND */
    .trend {
      font-size: 15px;
      display: inline-block;
    }
    .trend.up { color: var(--green); }
    .trend.down { color: var(--orange); }
    .trend.neutral { color: var(--muted); }
    .trend.inverted { color: var(--red); }

    /* STATUS PILL */
    .status-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 500;
    }
    .status-pill.healthy { background: rgba(0,200,150,0.15); color: var(--green); border: 1px solid rgba(0,200,150,0.3); }
    .status-pill.compressed { background: rgba(245,197,24,0.12); color: var(--yellow); border: 1px solid rgba(245,197,24,0.3); }
    .status-pill.inverted { background: rgba(255,68,68,0.15); color: var(--red); border: 1px solid rgba(255,68,68,0.35); }

    /* PNL COLORS */
    .pnl-pos { color: var(--green); }
    .pnl-neg { color: var(--red); }

    /* EXIT CHECK */
    .exit-check { color: var(--green); font-size: 16px; }
    .exit-dash { color: #333; }

    /* ROUTE */
    .route-text {
      color: var(--muted);
      font-size: 11px;
    }
    .route-text span { color: #555; margin: 0 3px; }

    /* LOADING / ERROR */
    .loading-state, .error-state {
      text-align: center;
      padding: 60px 20px;
      font-family: 'DM Mono', monospace;
    }
    .loading-state {
      color: var(--muted);
      font-size: 13px;
    }
    .loading-dots::after {
      content: '...';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
    .error-state {
      color: var(--red);
      font-size: 13px;
    }
    .error-state .err-detail {
      color: var(--muted);
      font-size: 11px;
      margin-top: 8px;
    }

    /* SECTION SPACING */
    .section { margin-bottom: 20px; }

    /* FOOTER */
    footer {
      margin-top: 48px;
      padding: 20px 0;
      border-top: 1px solid var(--border);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: #333;
      text-align: center;
      letter-spacing: 0.5px;
    }

    @media (max-width: 900px) {
      .stats-bar { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .header h1 { font-size: 36px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="brand">ARB</div>
    <a href="/">HUB</a>
    <a href="/dashboard.html">DASHBOARD</a>
    <a href="/rates.html">RATE CHARTS</a>
    <a href="/report.html" class="active">REPORT</a>
    <a href="/pnl.html">P&L HISTORY</a>
    <a href="/golive.html">GO LIVE</a>
    <a href="/watchlist.html">WATCHLIST</a>
    <a href="/explainer.html">EXPLAINER</a>
  </nav>

  <div class="container">

    <!-- HEADER -->
    <div class="header section">
      <h1>TRADE REPORT</h1>
      <div class="subtitle">FUNDING RATE ARBITRAGE — LIVE POSITION ANALYSIS</div>
      <div class="updated" id="last-updated">LOADING...</div>
    </div>

    <!-- MAIN CONTENT (populated by JS) -->
    <div id="app">
      <div class="loading-state">
        <span class="loading-dots">FETCHING TRADES</span>
      </div>
    </div>

  </div>

  <footer>FUNDING RATE ARB MONITOR — AUTO-REFRESHES EVERY 60s</footer>

  <script>
    const EXCLUDED_EXCHANGES = new Set(['drift']);
    const EXCLUDED_COINS = new Set([
      'PAXG','XAUT','SPYX','AAPLX','GOOGLX','MSFTX','TSLAX',
      'AMZNX','NVDAX','METAX','MSTRX','QQQX','CRCLX'
    ]);

    function getApiBase() {
      const h = window.location.hostname;
      if (h.includes('github.io') || h.includes('onrender.com')) {
        return 'https://mvp-polymarket-alpha-bot.onrender.com';
      }
      return 'http://localhost:3124';
    }

    function fmtPct(v) { return (v * 100).toFixed(3) + '%'; }
    function fmtUsd(v) {
      const abs = Math.abs(v);
      const s = abs >= 1000 ? '$' + abs.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
                            : '$' + abs.toFixed(2);
      return v < 0 ? '-' + s : s;
    }
    function fmtDays(d) { return d < 1 ? (d * 24).toFixed(1) + 'h' : d.toFixed(1) + 'd'; }

    function processTradeData(raw) {
      const now = Date.now();
      return raw
        .filter(t =>
          !EXCLUDED_EXCHANGES.has((t.longExchange||'').toLowerCase()) &&
          !EXCLUDED_EXCHANGES.has((t.shortExchange||'').toLowerCase()) &&
          !EXCLUDED_COINS.has((t.coin||'').toUpperCase())
        )
        .map(t => {
          const ageHours = (now - t.entryTime) / 3600000;
          const holdDays = ageHours / 24;
          const entryPct = t.entrySpread * 100;
          const currentPct = t.currentSpread * 100;
          const dailyEarn = t.currentSpread * 3 * (t.notional || 1000) * (t.leverage || 1);

          let status;
          if (t.currentSpread < 0) status = 'INVERTED';
          else if (t.currentSpread < t.entrySpread * 0.3) status = 'COMPRESSED';
          else status = 'HEALTHY';

          let trend;
          if (t.currentSpread < 0) trend = '⊘';
          else if (t.currentSpread > t.entrySpread * 1.1) trend = '↑';
          else if (t.currentSpread < t.entrySpread * 0.5) trend = '↓';
          else trend = '→';

          const improving = t.currentSpread > t.entrySpread * 1.5;
          const exitReady = Math.abs(t.currentSpread) < 0.0001 && ageHours > 4;
          const entryDate = new Date(t.entryTime).toLocaleDateString('en-US', {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });

          return {
            ...t,
            ageHours,
            holdDays,
            entryPct,
            currentPct,
            dailyEarn,
            status,
            trend,
            improving,
            exitReady,
            entryDate
          };
        });
    }

    function buildStatsBar(trades) {
      const totalPnl = trades.reduce((s, t) => s + (t.accumulatedPnl || 0), 0);
      const winners = trades.filter(t => (t.accumulatedPnl || 0) > 0).length;
      const winRate = trades.length ? (winners / trades.length * 100).toFixed(0) : 0;
      const healthyCount = trades.filter(t => t.status === 'HEALTHY').length;
      const invertedCount = trades.filter(t => t.status === 'INVERTED').length;

      const pnlClass = totalPnl >= 0 ? 'pnl-pos' : 'pnl-neg';
      return `
        <div class="stats-bar section">
          <div class="stat-card">
            <div class="label">Total Trades</div>
            <div class="value">${trades.length}</div>
          </div>
          <div class="stat-card pnl">
            <div class="label">Total P&amp;L</div>
            <div class="value ${pnlClass}">${fmtUsd(totalPnl)}</div>
          </div>
          <div class="stat-card winrate">
            <div class="label">Win Rate</div>
            <div class="value" style="color:var(--blue)">${winRate}%</div>
          </div>
          <div class="stat-card healthy">
            <div class="label">Healthy</div>
            <div class="value" style="color:var(--green)">${healthyCount}</div>
          </div>
          <div class="stat-card inverted">
            <div class="label">Inverted</div>
            <div class="value" style="color:${invertedCount > 0 ? 'var(--red)' : 'var(--muted)'}">${invertedCount}</div>
          </div>
        </div>`;
    }

    function buildHealthBar(trades) {
      const total = trades.length || 1;
      const healthy = trades.filter(t => t.status === 'HEALTHY').length;
      const compressed = trades.filter(t => t.status === 'COMPRESSED').length;
      const inverted = trades.filter(t => t.status === 'INVERTED').length;
      const hp = (healthy / total * 100).toFixed(1);
      const cp = (compressed / total * 100).toFixed(1);
      const ip = (inverted / total * 100).toFixed(1);

      return `
        <div class="health-bar-section section">
          <div class="health-bar-label">Portfolio Health</div>
          <div class="health-bar">
            ${healthy > 0 ? `<div class="seg healthy" style="width:${hp}%">${healthy > 2 ? healthy + ' HEALTHY' : healthy}</div>` : ''}
            ${compressed > 0 ? `<div class="seg compressed" style="width:${cp}%">${compressed > 2 ? compressed + ' COMPRESSED' : compressed}</div>` : ''}
            ${inverted > 0 ? `<div class="seg inverted" style="width:${ip}%">${inverted > 2 ? inverted + ' INVERTED' : inverted}</div>` : ''}
          </div>
          <div class="health-bar-legend">
            <div class="legend-item"><div class="legend-dot healthy"></div> HEALTHY (${healthy})</div>
            <div class="legend-item"><div class="legend-dot compressed"></div> COMPRESSED (${compressed})</div>
            <div class="legend-item"><div class="legend-dot inverted"></div> INVERTED (${inverted})</div>
          </div>
        </div>`;
    }

    function buildInvertedAlert(trades) {
      const inverted = trades.filter(t => t.status === 'INVERTED');
      if (!inverted.length) return '';
      const items = inverted.map(t => `
        <div class="alert-item">
          <span class="coin-badge">${t.coin}</span>
          <span class="route">${(t.longExchange||'?').toUpperCase()} <span>→</span> ${(t.shortExchange||'?').toUpperCase()}</span>
          <span class="bleed">${fmtUsd(Math.abs(t.dailyEarn))}/day bleed</span>
          <span class="pnl-val ${(t.accumulatedPnl||0) >= 0 ? 'pnl-pos' : 'pnl-neg'}">P&amp;L: ${fmtUsd(t.accumulatedPnl||0)}</span>
          ${t.ageHours > 24 ? '<span style="color:var(--red);font-size:10px;font-family:\'DM Mono\',monospace;">⚠ >24h — CONSIDER CLOSING</span>' : '<span style="color:var(--yellow);font-size:10px;font-family:\'DM Mono\',monospace;">< 24h — HOLD</span>'}
        </div>`).join('');
      return `
        <div class="alert-box inverted-alert section">
          <div class="box-title">⚠ INVERTED POSITIONS</div>
          <div class="box-subtitle">These positions are actively losing. Hold if &lt; 24h old; consider closing if &gt; 24h.</div>
          <div class="alert-items">${items}</div>
        </div>`;
    }

    function buildImprovingSection(trades) {
      const improving = trades.filter(t => t.improving);
      if (!improving.length) return '';
      const items = improving.map(t => {
        const growPct = ((t.currentSpread - t.entrySpread) / t.entrySpread * 100).toFixed(1);
        return `
          <div class="alert-item">
            <span class="coin-badge">${t.coin}</span>
            <span class="route">${(t.longExchange||'?').toUpperCase()} <span>→</span> ${(t.shortExchange||'?').toUpperCase()}</span>
            <span style="color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;">${t.entryPct.toFixed(3)}% → </span>
            <span class="grow">${t.currentPct.toFixed(3)}%</span>
            <span style="color:var(--green);font-family:'DM Mono',monospace;font-size:11px;background:rgba(0,200,150,0.1);padding:2px 8px;border-radius:3px;">+${growPct}% growth</span>
          </div>`;
      }).join('');
      return `
        <div class="alert-box improving-alert section">
          <div class="box-title">🚀 GROWING SPREADS</div>
          <div class="box-subtitle">These positions have expanded ≥1.5× their entry spread.</div>
          <div class="alert-items">${items}</div>
        </div>`;
    }

    function buildExitCriteria() {
      return `
        <div class="alert-box exit-info section">
          <div class="box-title">EXIT CRITERIA</div>
          <p>Exit triggers when |spread| &lt; 0.01% AND held &gt; 4h. Spreads naturally compress — hold through dips. Force-exit only if inverted 24h+.</p>
        </div>`;
    }

    function buildTable(trades) {
      let sortKey = 'accumulatedPnl';
      let sortDir = -1;

      const cols = [
        { key: 'coin', label: 'COIN', numeric: false },
        { key: 'route', label: 'ROUTE', numeric: false },
        { key: 'entryPct', label: 'ENTRY %', numeric: true },
        { key: 'currentPct', label: 'CURRENT %', numeric: true },
        { key: 'trend', label: 'TREND', numeric: false },
        { key: 'status', label: 'STATUS', numeric: false },
        { key: 'accumulatedPnl', label: 'P&L', numeric: true },
        { key: 'dailyEarn', label: '$/DAY', numeric: true },
        { key: 'holdDays', label: 'HOLD DAYS', numeric: true },
        { key: 'entryDate', label: 'ENTRY DATE', numeric: false },
        { key: 'exitReady', label: 'EXIT?', numeric: false },
      ];

      function sortedTrades() {
        return [...trades].sort((a, b) => {
          let av = a[sortKey], bv = b[sortKey];
          if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
          if (typeof av === 'boolean') return (Number(bv) - Number(av)) * sortDir;
          return ((av || 0) - (bv || 0)) * sortDir;
        });
      }

      function renderRow(t) {
        const spreadClass = t.currentSpread < 0 ? 'spread-red'
          : t.currentSpread < t.entrySpread * 0.3 ? 'spread-yellow'
          : 'spread-green';
        const trendClass = t.trend === '↑' ? 'up' : t.trend === '↓' ? 'down' : t.trend === '⊘' ? 'inverted' : 'neutral';
        const statusCls = t.status.toLowerCase();
        const pnlCls = (t.accumulatedPnl||0) >= 0 ? 'pnl-pos' : 'pnl-neg';
        const dayCls = t.dailyEarn >= 0 ? 'pnl-pos' : 'pnl-neg';
        return `<tr>
          <td><span class="coin-badge">${t.coin}</span></td>
          <td><span class="route-text">${(t.longExchange||'?').toUpperCase()}<span>→</span>${(t.shortExchange||'?').toUpperCase()}</span></td>
          <td>${t.entryPct.toFixed(3)}%</td>
          <td class="${spreadClass}">${t.currentPct.toFixed(3)}%</td>
          <td><span class="trend ${trendClass}">${t.trend}</span></td>
          <td><span class="status-pill ${statusCls}">${t.status}</span></td>
          <td class="${pnlCls}">${fmtUsd(t.accumulatedPnl||0)}</td>
          <td class="${dayCls}">${fmtUsd(t.dailyEarn)}</td>
          <td>${fmtDays(t.holdDays)}</td>
          <td style="color:var(--muted)">${t.entryDate}</td>
          <td>${t.exitReady ? '<span class="exit-check">✓</span>' : '<span class="exit-dash">—</span>'}</td>
        </tr>`;
      }

      function renderTable() {
        const sorted = sortedTrades();
        const thead = `<thead><tr>${cols.map(c => {
          let cls = '';
          if (c.key === sortKey) cls = sortDir === 1 ? 'sorted sort-asc' : 'sorted sort-desc';
          return `<th class="${cls}" data-key="${c.key}">${c.label}</th>`;
        }).join('')}</tr></thead>`;
        const tbody = `<tbody>${sorted.map(renderRow).join('')}</tbody>`;
        return thead + tbody;
      }

      const tableId = 'main-table';
      const html = `
        <div class="section">
          <div class="table-header">
            <h2>ALL POSITIONS</h2>
            <span class="sort-hint">Click column headers to sort</span>
          </div>
          <div class="table-wrap">
            <table id="${tableId}">${renderTable()}</table>
          </div>
        </div>`;

      // Attach sort listeners after DOM insert
      setTimeout(() => {
        const table = document.getElementById(tableId);
        if (!table) return;
        table.querySelectorAll('thead th').forEach(th => {
          th.addEventListener('click', () => {
            const key = th.dataset.key;
            if (sortKey === key) sortDir *= -1;
            else { sortKey = key; sortDir = key === 'accumulatedPnl' ? -1 : 1; }
            table.innerHTML = renderTable();
            // re-attach
            table.querySelectorAll('thead th').forEach(th2 => {
              th2.addEventListener('click', arguments.callee);
            });
          });
        });
      }, 50);

      return html;
    }

    function renderAll(trades) {
      const app = document.getElementById('app');
      const ts = new Date().toLocaleString('en-US', { timeZone: 'America/New_York', hour12: false });
      document.getElementById('last-updated').textContent = `LAST UPDATED: ${ts} EST`;

      app.innerHTML =
        buildStatsBar(trades) +
        buildHealthBar(trades) +
        buildInvertedAlert(trades) +
        buildImprovingSection(trades) +
        buildExitCriteria() +
        buildTable(trades);
    }

    async function loadTrades() {
      const base = getApiBase();
      try {
        const res = await fetch(`${base}/api/paper-trades`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.json();
        const trades = processTradeData(raw);
        renderAll(trades);
      } catch (err) {
        document.getElementById('app').innerHTML = `
          <div class="error-state">
            ⚠ FAILED TO LOAD TRADES
            <div class="err-detail">${err.message}</div>
            <div class="err-detail" style="margin-top:4px">API: ${getApiBase()}/api/paper-trades</div>
          </div>`;
        document.getElementById('last-updated').textContent = 'LAST UPDATED: ERROR';
      }
    }

    loadTrades();
    setInterval(loadTrades, 60000);
  </script>

</body>
</html>
